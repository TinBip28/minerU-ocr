# MinerU OCR Production Compose - Optimized Slim Version
# Usage:
#   mkdir -p models
#   docker compose -f docker/compose.ocr-slim.yaml run --rm init-models
#   docker compose -f docker/compose.ocr-slim.yaml up
#   docker compose -f docker/compose.ocr-slim.yaml up -d

services:
  # Model initialization service (run once before first use)
  init-models:
    image: mineru-ocr-vi:slim
    container_name: mineru-ocr-init

    entrypoint:
      - /bin/bash
      - /app/docker/init-models.sh

    environment:
      MINERU_MODEL_SOURCE: auto
      MINERU_MODEL_BASE_DIR: /models

    volumes:
      - mineru-models:/models

    restart: "no"

  mineru-ocr-api:
    image: mineru-ocr-vi:slim
    container_name: mineru-ocr-api
    restart: unless-stopped

    depends_on:
      init-models:
        condition: service_completed_successfully

    ports:
      - "8000:8000"

    environment:
      MINERU_MODEL_SOURCE: local
      MINERU_MODEL_BASE_DIR: /models
      MINERU_DEVICE_MODE: cuda
      MINERU_MODEL_STACK: full
      MINERU_FORMULA_ENABLE: "false"

    # Health check
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import httpx; r=httpx.get('http://127.0.0.1:8000/v1/health', timeout=5); exit(0 if r.is_success else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    # GPU support
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864

    volumes:
      # Models persistent volume
      - mineru-models:/models

      # Optional: input/output directories
      # - ./data:/data
      # - ./output:/output

    command:
      - api-server
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --tier
      - basic
      - --language
      - vi
      - --concurrency
      - "1"

volumes:
  mineru-models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/models
